<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Doom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .game-wrapper {
    position: relative;
    width: 800px;
    height: 600px;
  }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }

  /* UP / DOWN buttons
     Canvas is 600px tall.
     Grass starts ~y=430 (30% from bottom = 180px from bottom).
     We want buttons 70% in grass, 30% in pavement.
     Each button is 56px tall, gap 10px → total ~122px.
     Position: bottom: 60px places them nicely in grass zone. */
  .dpad {
    position: absolute;
    right: 10px;
    bottom: 60px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }

  .dpad-btn {
    width: 56px;
    height: 56px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 12px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s;
  }

  .dpad-btn:active,
  .dpad-btn.pressed {
    background: rgba(255, 255, 255, 0.38);
  }

  /* START button — shown on start screen */
  #start-btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 55px;
    padding: 14px 48px;
    background: rgba(255, 204, 0, 0.9);
    border: 2px solid #ffcc00;
    border-radius: 10px;
    color: #000;
    font-size: 20px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    cursor: pointer;
    z-index: 10;
    display: none;
    user-select: none;
    letter-spacing: 1px;
  }

  #start-btn:active { background: rgba(255, 180, 0, 1); }

  /* RESTART button — shown on game over / win */
  #restart-btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 140px;
    padding: 14px 48px;
    background: rgba(255, 204, 0, 0.9);
    border: 2px solid #ffcc00;
    border-radius: 10px;
    color: #000;
    font-size: 20px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    cursor: pointer;
    z-index: 10;
    display: none;
    user-select: none;
    letter-spacing: 1px;
  }

  #restart-btn:active { background: rgba(255, 180, 0, 1); }
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="game" width="800" height="600"></canvas>

  <!-- D-Pad buttons — right side, in grass zone -->
  <div class="dpad">
    <button class="dpad-btn" id="btn-up">▲</button>
    <button class="dpad-btn" id="btn-down">▼</button>
  </div>

  <!-- Start button -->
  <button id="start-btn">▶ &nbsp;START</button>

  <!-- Restart button — uses ↻ restart symbol -->
  <button id="restart-btn"> &nbsp;RESTART</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 800, H = 600;

// ─── BUTTONS ─────────────────────────────────────────────────
const startBtn   = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const btnUp      = document.getElementById('btn-up');
const btnDown    = document.getElementById('btn-down');

// UP button
['mousedown','touchstart'].forEach(ev => {
  btnUp.addEventListener(ev, (e) => {
    e.preventDefault();
    player.velocityY = -5;
    btnUp.classList.add('pressed');
  });
});
['mouseup','touchend','mouseleave','touchcancel'].forEach(ev => {
  btnUp.addEventListener(ev, (e) => {
    e.preventDefault();
    if (player.velocityY < 0) player.velocityY = 0;
    btnUp.classList.remove('pressed');
  });
});

// DOWN button
['mousedown','touchstart'].forEach(ev => {
  btnDown.addEventListener(ev, (e) => {
    e.preventDefault();
    player.velocityY = +5;
    btnDown.classList.add('pressed');
  });
});
['mouseup','touchend','mouseleave','touchcancel'].forEach(ev => {
  btnDown.addEventListener(ev, (e) => {
    e.preventDefault();
    if (player.velocityY > 0) player.velocityY = 0;
    btnDown.classList.remove('pressed');
  });
});

// Start button
['click','touchstart'].forEach(ev => {
  startBtn.addEventListener(ev, (e) => {
    e.preventDefault();
    if (!gameStarted) {
      gameStarted = true;
      startAudio();
      startBtn.style.display = 'none';
    }
  });
});

// Restart button
['click','touchstart'].forEach(ev => {
  restartBtn.addEventListener(ev, (e) => {
    e.preventDefault();
    restartGame();
  });
});

// ─── IMAGE LOADING ───────────────────────────────────────────
function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img;
}

const images = {
  background: loadImage('./background.png'),
  player:     loadImage('./player.png'),
  student:    loadImage('./student.png'),
  student2:   loadImage('./student2.png'),
  drink:      loadImage('./drink.png'),
  purdue:     loadImage('./purdue.png'),
};

// ─── AUDIO ───────────────────────────────────────────────────
let audioStarted = false;

function playAudio(src, loop, volume) {
  try {
    const a = new Audio(src);
    a.loop = loop || false;
    a.volume = volume !== undefined ? volume : 1.0;
    a.play().catch(() => {});
    return a;
  } catch(e) { return null; }
}

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;
  playAudio('./RESUME.wav', true, 0.3);
  playAudio('./scream.wav', true, 0.12);
}

// ─── GAME STATE ───────────────────────────────────────────────
let gameStarted = false;
let gameOver    = false;
let gameWon     = false;
let bgX         = 0;
let floatTimer  = 0;
let monstersCollected = 0;
let spawnTimer  = 0;
let spawnTimer2 = 0;
let canSpawnTimer = 0;

// ─── PLAYER ──────────────────────────────────────────────────
const player = {
  x: 100, y: 350,
  velocityY: 0,
  currentFrame: 0, animTimer: 0,
  frameW: 32, frameH: 48,
  drawW: 96, drawH: 144,

  update() {
    this.y += this.velocityY;
    if (this.y < 180) this.y = 180;
    if (this.y > 326) this.y = 326;
    this.animTimer++;
    if (this.animTimer >= 12) {
      this.currentFrame = (this.currentFrame + 1) % 4;
      this.animTimer = 0;
    }
  },

  draw() {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(images.player,
      this.currentFrame * this.frameW, 0, this.frameW, this.frameH,
      this.x, this.y, this.drawW, this.drawH);
  }
};

// ─── STUDENTS ────────────────────────────────────────────────
let students = [];

function spawnStudent(fast) {
  students.push({
    x: 800, y: player.y,
    speed: fast ? 5 : 3,
    isFast: fast,
    currentFrame: 0, animTimer: 0, alive: true,
    frameW: 32, frameH: 48, drawW: 96, drawH: 144,

    update() {
      this.x -= this.speed;
      this.animTimer++;
      if (this.animTimer >= (this.isFast ? 6 : 12)) {
        this.currentFrame = (this.currentFrame + 1) % 4;
        this.animTimer = 0;
      }
      if (this.x < -100) this.alive = false;
    },

    draw() {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(this.isFast ? images.student2 : images.student,
        this.currentFrame * this.frameW, 0, this.frameW, this.frameH,
        this.x, this.y, this.drawW, this.drawH);
    }
  });
}

// ─── MONSTER CANS ────────────────────────────────────────────
let cans = [];

function spawnCan() {
  const randomY = 330 + Math.floor(Math.random() * 80);
  cans.push({
    x: 850, y: randomY,
    currentFrame: 0, animTimer: 0, alive: true,
    frameW: 32, frameH: 48, drawW: 48, drawH: 72,

    update() {
      this.x -= 2;
      this.animTimer++;
      if (this.animTimer >= 10) {
        this.currentFrame = (this.currentFrame + 1) % 4;
        this.animTimer = 0;
      }
      if (this.x < -100) this.alive = false;
    },

    draw() {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(images.drink,
        this.currentFrame * this.frameW, 0, this.frameW, this.frameH,
        this.x, this.y, this.drawW, this.drawH);
    }
  });
}

// ─── COLLISION ───────────────────────────────────────────────
function isCollidingStudent(s) {
  const pL = player.x + 35, pR = player.x + 61;
  const pT = player.y + 125, pB = player.y + 144;
  const sL = s.x + 35, sR = s.x + 61;
  const sT = s.y + 125, sB = s.y + 144;
  return pL < sR && pR > sL && pT < sB && pB > sT;
}

function isCollidingCan(c) {
  return player.x + 40 < c.x + 40
      && player.x + 60 > c.x + 8
      && player.y + 100 < c.y + 72
      && player.y + 144 > c.y + 10;
}

// ─── RESTART ─────────────────────────────────────────────────
function restartGame() {
  gameOver = false; gameWon = false; gameStarted = true;
  bgX = 0; monstersCollected = 0;
  spawnTimer = 0; spawnTimer2 = 0; canSpawnTimer = 0;
  students = []; cans = [];
  player.x = 100; player.y = 350;
  player.velocityY = 0; player.currentFrame = 0;
  restartBtn.style.display = 'none';
  startBtn.style.display = 'none';
}

// ─── KEYBOARD ────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !gameStarted) {
    gameStarted = true;
    startAudio();
    startBtn.style.display = 'none';
    e.preventDefault();
  }
  if (e.code === 'ArrowUp')   { player.velocityY = -5; e.preventDefault(); }
  if (e.code === 'ArrowDown') { player.velocityY = +5; e.preventDefault(); }
  if (e.code === 'KeyR' && (gameOver || gameWon)) restartGame();
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown') player.velocityY = 0;
});

// ─── DRAW HELPER ─────────────────────────────────────────────
function drawCentered(text, y, font, color) {
  ctx.font = font;
  ctx.fillStyle = color;
  const w = ctx.measureText(text).width;
  ctx.fillText(text, (W - w) / 2, y);
}

// ─── UPDATE ──────────────────────────────────────────────────
function update() {
  floatTimer++;
  if (!gameStarted || gameOver || gameWon) return;

  player.update();

  spawnTimer++;
  if (spawnTimer >= 120) { spawnStudent(false); spawnTimer = 0; }
  spawnTimer2++;
  if (spawnTimer2 >= 300) { spawnStudent(true); spawnTimer2 = 0; }

  for (let i = students.length - 1; i >= 0; i--) {
    students[i].update();
    if (!students[i].alive) students.splice(i, 1);
  }

  for (let i = 0; i < students.length; i++) {
    if (isCollidingStudent(students[i])) {
      gameOver = true;
      restartBtn.style.display = 'block';
      return;
    }
  }

  canSpawnTimer++;
  if (canSpawnTimer >= 200) { spawnCan(); canSpawnTimer = 0; }

  for (let i = cans.length - 1; i >= 0; i--) {
    cans[i].update();
    if (!cans[i].alive) { cans.splice(i, 1); continue; }
    if (isCollidingCan(cans[i])) {
      monstersCollected++;
      cans.splice(i, 1);
      playAudio('./monster.wav', false, 0.8);
    }
  }

  if (monstersCollected >= 10) {
    gameWon = true;
    restartBtn.style.display = 'block';
    return;
  }

  bgX -= 2;
  if (bgX <= -800) bgX = 0;
}

// ─── DRAW ────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;

  // Background
  ctx.drawImage(images.background, bgX, 0, 800, 600);
  ctx.drawImage(images.background, bgX + 800, 0, 800, 600);

  // Students behind player
  students.forEach(s => { if (s.y < player.y) s.draw(); });
  // Cans
  cans.forEach(c => c.draw());
  // Player
  player.draw();
  // Students in front
  students.forEach(s => { if (s.y >= player.y) s.draw(); });

  // Progress bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, 10, 204, 24);
  ctx.fillStyle = 'rgb(0,180,0)';
  ctx.fillRect(12, 12, Math.floor(200 * (monstersCollected / 10)), 20);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 13px Arial';
  ctx.fillText('Monster: ' + monstersCollected + '/10', 220, 27);

  // Purdue logo floating
  if (images.purdue.complete) {
    const floatY = Math.sin(floatTimer * 0.05) * 6;
    ctx.drawImage(images.purdue, 360, 5 + floatY, 80, 80);
  }

  // START SCREEN
  if (!gameStarted) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);
    if (images.purdue.complete) {
      const floatY = Math.sin(floatTimer * 0.05) * 6;
      ctx.drawImage(images.purdue, 350, 50 + floatY, 100, 100);
    }
    drawCentered('CAREER', 210, 'bold 80px Arial', '#ffcc00');
    drawCentered('DOOM',   300, 'bold 80px Arial', '#ff3333');
    drawCentered("You're the interviewer — dodge students, collect Monster, reach your tent!", 340, '18px Arial', 'white');
    drawCentered('UP / DOWN arrows to move', 390, '16px Arial', '#cccccc');
    drawCentered('Press SPACE to Start', 440, 'bold 22px Arial', '#ffcc00');
    startBtn.style.display = 'block';
    restartBtn.style.display = 'none';
  }

  // GAME OVER
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(180,0,0,0.88)';
    ctx.fillStyle = 'rgb(220,0,0)';
    ctx.fillRect(150, 180, 500, 230);  // was 200 start, 200 height → now 180 start, 230 height
    ctx.fillRect(150, 180, 500, 4);    // top border
    ctx.fillRect(150, 406, 500, 4);    // bottom border
    drawCentered('GAME OVER', 270, 'bold 65px Arial', 'white');
    drawCentered('You got buried in resumes!', 320, '22px Arial', 'rgb(255,200,200)');
    drawCentered('Press R to Restart', 365, 'bold 20px Arial', 'yellow');
  }

  // WIN SCREEN
  if (gameWon) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,200,0,0.88)';
    ctx.fillRect(150, 180, 500, 220);
    drawCentered('YOU WIN!', 270, 'bold 60px Arial', 'black');
    drawCentered('YOU REACHED YOUR TENT !!', 318, '20px Arial', 'white');
    drawCentered('Press R to Play Again', 360, 'bold 20px Arial', 'yellow');
  }
}

// ─── LOOP ────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }

// Show start button immediately
startBtn.style.display = 'block';

// Wait for images then start loop
let loaded = 0;
const total = Object.keys(images).length;
Object.values(images).forEach(img => {
  img.onload  = () => { if (++loaded >= total) loop(); };
  img.onerror = () => { if (++loaded >= total) loop(); };
});
setTimeout(() => { if (loaded < total) loop(); }, 2000);
</script>
</body>
</html>
